[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symfind-2"
version = "0.0.0"
description = "Python wrappers for the Symfind-2 halo finder"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }

[tool.setuptools.packages.find]
where = ["src"]
